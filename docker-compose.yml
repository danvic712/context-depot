services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: context_depot
      POSTGRES_USER: context_depot
      POSTGRES_PASSWORD: context_depot_dev_only
    ports:
      - "5432:5432"
    volumes:
      - context-depot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_depot -d context_depot"]
      interval: 5s
      timeout: 5s
      retries: 12

  context-depot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=context_depot;Username=context_depot;Password=context_depot_dev_only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  context-depot-postgres:
