x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: contextdepot
      POSTGRES_USER: contextdepot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${DATA_DIR:-./data}/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U contextdepot -d contextdepot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  database-init:
    image: pgvector/pgvector:pg17
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    entrypoint: ["psql"]
    command:
      - --host=database
      - --username=contextdepot
      - --dbname=contextdepot
      - --set=ON_ERROR_STOP=1
      - --command=CREATE EXTENSION IF NOT EXISTS vector;
    depends_on:
      database:
        condition: service_healthy
    logging: *default-logging

  context-depot:
    image: danvic712/context-depot:${CONTEXTDEPOT_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ContextDepot: >-
        Host=database;Port=5432;Database=contextdepot;Username=contextdepot;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DataProtection__KeyRingPath: /home/context-depot/keys
    volumes:
      - ${DATA_DIR:-./data}/context-depot:/home/context-depot
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    logging: *default-logging
