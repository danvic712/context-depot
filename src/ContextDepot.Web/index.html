<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f5f2" />
    <style>
      html {
        background: #f3f5f2;
      }
      html[data-theme="dark"] {
        background: #151917;
        color-scheme: dark;
      }
      body {
        margin: 0;
      }
    </style>
    <script>
      const browserLanguages =
        typeof navigator === "undefined"
          ? []
          : navigator.languages?.length
            ? navigator.languages
            : [navigator.language];
      const browserLanguage =
        browserLanguages
          .map((value) => value?.toLowerCase().split("-")[0])
          .find((value) => value === "zh" || value === "en") ?? "en";
      try {
        const setup = location.pathname === "/setup";
        const allowedThemes = ["system", "light", "dark"];
        const override = localStorage.getItem(
          setup ? "contextdepot.setup.theme" : "contextdepot.theme",
        );
        const cachedTheme = setup
          ? null
          : localStorage.getItem("contextdepot.theme-mode");
        const theme = allowedThemes.includes(override)
          ? override
          : allowedThemes.includes(cachedTheme)
            ? cachedTheme
            : "system";
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        const savedLanguage = localStorage.getItem(
          setup ? "contextdepot.setup.language" : "contextdepot.language",
        );
        const language = ["en", "zh"].includes(savedLanguage)
          ? savedLanguage
          : browserLanguage;
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
        document.documentElement.lang =
          browserLanguage === "zh" ? "zh-CN" : "en";
      }
    </script>
    <title>ContextDepot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
