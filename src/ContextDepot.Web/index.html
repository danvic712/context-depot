<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f5f2" />
    <style>
      html {
        background: #f3f5f2;
      }
      html[data-theme="dark"] {
        background: #151917;
        color-scheme: dark;
      }
      body {
        margin: 0;
      }
    </style>
    <script>
      try {
        const allowedThemes = ["system", "light", "dark"];
        const override = localStorage.getItem("contextdepot.theme");
        const cachedTheme = localStorage.getItem("contextdepot.theme-mode");
        const theme = allowedThemes.includes(override)
          ? override
          : allowedThemes.includes(cachedTheme)
            ? cachedTheme
            : "system";
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.lang =
          localStorage.getItem("contextdepot.language") === "zh"
            ? "zh-CN"
            : "en";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
    <title>ContextDepot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
